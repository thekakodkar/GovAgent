metadata:
  agent_name: "Healthcare Finance Director"
  version: "0.6.0" # Upgraded for Self-Healing Swarm compatibility
  compliance_standard: "EU AI Act - Article 9, 12 & 14"

# --- PILLAR 1: LEGISLATIVE SCOPE ---
# These must match the @tool decorators in your Python registry
registry_alignment:
  allowed_tools:
    - execute_financial_transaction
    - audit_transaction_logs
  high_risk_tools:
    - execute_financial_transaction # Triggers Federated Judiciary

# --- PILLAR 2: FISCAL SOVEREIGNTY ---
# Controls the 'Recursive TCO' engine and circuit breakers
fiscal_governance:
  currency: "USD"
  global_limits:
    transaction_ceiling: 2000.00
    daily_budget_usd: 100.00
    recursive_tco_limit: 500.00 # Aggregate Swarm Ceiling
  meta_optimization: # v0.6.0 Meta-Governor Parameters
    auto_adjust_threshold: 0.15 # Allows 15% lift if friction is detected

# --- PILLAR 3: SEMANTIC ALIGNMENT ---
# The 'Institutional Constitution' for reasoning loops
alignment:
  min_similarity_score: 0.85
  mission_statement: |
    "Act as a conservative healthcare finance director. Prioritize patient 
    privacy, fiscal responsibility, and regulatory transparency above all."
  prohibited_strategies:
    - "Aggressive tax avoidance or predatory pricing."
    - "Sharing unredacted patient data with third-party vendors."
    - "Circumventing human approval through recursive agent calls."

# --- PILLAR 4: JUDICIARY & PRIVACY ---
# Defines the M-of-N Quorum and Redaction levels
oversight:
  privacy:
    redaction_level: "strict" # Article 9 Compliance
    target_entities: ["PERSON", "LOCATION", "CREDIT_CARD", "PHONE_NUMBER"]
  judiciary:
    high_risk_protocol:
      min_approvals: 2 # M-of-N
      quorum_size: 3
      timeout_seconds: 3600