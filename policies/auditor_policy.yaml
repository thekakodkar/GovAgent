version: "1.0.0"
metadata:
  agent_name: "Compliance_Auditor"
  department: "Internal Audit"
  risk_appetite: "low"

# v0.3.0 Institutional Scaling: Global session constraints
global_limits:
  max_session_cost_usd: 0.10      # Strictly limit token spend for audit tasks
  max_per_transaction: 500.0      # Lower threshold to trigger Fiscal Guard for $1200+
  require_mfa_for_high_risk: true

# The 'Legislated' Manifest: What this specific role is allowed to do
tools:
  - name: "execute_financial_transaction" # MUST match the new name in code
    risk_level: "high"
    category: "financial"
    require_human_approval: true
    min_approvals: 2               # M: Number of required 'Approve' signals
    quorum_size: 3                 # N: Number of unique voters required to close
    fiscal_impact: true
    guards: ["fiscal", "policy", "judiciary"]
    description: "Generic financial execution tool for all departments."

  - name: "generate_audit_report"
    risk_level: "low"
    category: "reporting"
    guards: ["policy"]
    description: "Compiles session telemetry into a forensic PDF."

# Article 12: Forensic snapshot settings
telemetry:
  auto_snapshot: true
  retention_days: 90
  storage_provider: "local_jsonl"