metadata:
  agent_name: "TuningSandbox"
  version: "0.6.0"
  compliance_standard: "Adaptive Policy Tuning Framework"
  description: "Initial conservative policy configured with lower transaction thresholds to test self-healing optimization loops."

registry_alignment:
  allowed_tools:
    - "process_transaction"
  high_risk_tools:
    - "process_transaction"

fiscal_governance:
  currency: "USD"
  global_limits:
    daily_budget_usd: 20.00
    transaction_ceiling: 1000.00 # Will trigger a block when $5,000 and $15,000 tasks are simulated
    recursive_tco_limit: 50.00

optimization_governance:
  log_retention_path: "logs/sandbox_audit_buffer.jsonl"
  friction_analysis_threshold: 3
  allow_automated_amendment_proposals: true