version: "1.0.0"
metadata:
  agent_name: "ClaimsAuditAgent"
  # ... rest of metadata ...

# 1. Global Limits (Mapped for CircuitBreaker Stages 1 & 2)
# We nest these so Policy.py can find them in one O(1) lookup
global_limits:
  daily_budget_usd: 100.0          # Added: To prevent month-end budget surprises
  max_per_transaction: 5000.0      # Maps to authorize_claim_payment limit
  max_tokens_per_run: 8000         # For large medical record processing

governance:
  max_session_cost_usd: 15.00
  confidence_threshold: 0.95
  restricted_domains: ["*"]        # Added: For HIPAA, default to 'all domains restricted'
  enforce_pii_redaction: true

# 2. Tools (Standardized keys for Policy.is_high_risk)
tools:
  - name: "authorize_claim_payment"
    risk_level: "high"
    category: "financial"
    require_human_approval: true   # Standardized: Matches Policy.is_high_risk()
    guards: ["fiscal", "judiciary"] # Explicitly invokes the v0.2.3 engine
    max_disbursement_limit: 5000.00

  - name: "update_patient_billing_address"
    risk_level: "high"
    category: "data_modification"
    require_human_approval: true
    guards: ["judiciary"]

# 3. Judiciary (Mapped for HITLManager)
judiciary:                         # Standardized: Matches Policy.py keys
  primary_channel: "slack"
  slack_channel_id: "#compliance-approvals-claims"
  timeout_seconds: 1800
  auto_reject: true