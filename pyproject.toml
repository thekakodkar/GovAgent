[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govagent"
version = "0.1.6"
description = "The Governance-First Framework for Agentic AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Niraj Kakodkar"},
    {email = "niraj.kakodkar@gmail.com"}
]
keywords = ["ai", "agents", "governance", "roi", "enterprise"]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.25.0",  # Async-ready for modern LLM APIs
]

[project.urls]
"Homepage" = "https://github.com/thekakodkar/govagent"
